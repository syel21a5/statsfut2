<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Outfit:wght@700;900&family=Teko:wght@700&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    width: 1080px;
    height: 1920px;
    background: #020617;
    font-family: 'Outfit', sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }

  /* Split Background com Luzes Vermelho vs Azul */
  .bg-split-left {
    position: absolute;
    top: 0;
    left: 0;
    width: 50%;
    height: 100%;
    background: radial-gradient(circle at 20% 40%, rgba(239, 68, 68, 0.25) 0%, transparent 70%);
  }
  .bg-split-right {
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    background: radial-gradient(circle at 80% 40%, rgba(14, 165, 233, 0.25) 0%, transparent 70%);
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 70px 45px 65px 45px;
    justify-content: space-between;
    align-items: center;
  }

  /* Selo Alerta / Notícia Urgente */
  .alert-pill {
    background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    border: 3px solid #fecaca;
    box-shadow: 0 0 45px rgba(239, 68, 68, 0.8);
    padding: 16px 50px;
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    text-transform: uppercase;
    animation: pulse 1.5s infinite;
  }

  /* Manchete de Tensão Máxima */
  .headline-wrap {
    text-align: center;
    margin-top: 15px;
  }
  .headline-danger {
    font-family: 'Montserrat', sans-serif;
    font-size: 105px;
    font-weight: 900;
    line-height: 0.95;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 10px 30px rgba(0,0,0,0.9);
  }
  .headline-danger span {
    color: #ef4444;
    text-shadow: 0 0 50px rgba(239, 68, 68, 0.8);
  }

  /* Arena Duelo - Escudos Enormes Lado a Lado */
  .vs-arena {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    margin: 20px 0;
  }
  .team-card {
    width: 46%;
    background: rgba(15, 23, 42, 0.85);
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-radius: 35px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  }
  .team-card.left { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 0 40px rgba(239, 68, 68, 0.3); }
  .team-card.right { border-color: rgba(14, 165, 233, 0.6); box-shadow: 0 0 40px rgba(14, 165, 233, 0.3); }

  .logo-box {
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
  }
  .team-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 36px;
    font-weight: 900;
    line-height: 1.1;
    color: #fff;
  }

  .vs-badge-central {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #fbbf24;
    color: #000;
    border: 5px solid #fff;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 46px;
    font-weight: 900;
    font-style: italic;
    box-shadow: 0 0 40px rgba(251, 191, 36, 0.9);
    z-index: 10;
  }

  /* Badge de Alvo / Pick */
  .target-board {
    width: 100%;
    background: rgba(15, 23, 42, 0.9);
    border: 4px solid #38bdf8;
    box-shadow: 0 0 50px rgba(56, 189, 248, 0.3);
    border-radius: 35px;
    padding: 30px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .target-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .target-tag {
    font-family: 'Montserrat', sans-serif;
    font-size: 24px;
    font-weight: 900;
    color: #38bdf8;
    letter-spacing: 2px;
  }
  .target-pick {
    font-size: 52px;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
  }
  .target-rate {
    font-family: 'Teko', sans-serif;
    font-size: 160px;
    font-weight: 700;
    line-height: 0.85;
    color: #38bdf8;
    text-shadow: 0 0 50px rgba(56, 189, 248, 0.8);
  }

  /* CTA de Ação Imediata */
  .cta-watch {
    width: 100%;
    background: #10b981;
    border-radius: 30px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 0 45px rgba(16, 185, 129, 0.6);
    border: 3px solid #a7f3d0;
  }
  .cta-watch-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 44px;
    font-weight: 900;
    color: #064e3b;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="bg-split-left"></div>
<div class="bg-split-right"></div>

<div class="container">
  
  <!-- 1. Alerta Vermelho -->
  <div class="alert-pill">
    🚨 ALERTA DE VALOR
  </div>

  <!-- 2. Headline -->
  <div class="headline-wrap">
    <div class="headline-danger">QUEM VAI <span>VENCER?</span></div>
  </div>

  <!-- 3. Confronto dos Times -->
  <div class="vs-arena">
    <div class="vs-badge-central">VS</div>

    <div class="team-card left">
      <div class="logo-box">
        <img src="file:///www/wwwroot/statsfut.com/static/teams/estados-unidos/310968.png" alt="Hartford">
      </div>
      <div class="team-label">HARTFORD</div>
    </div>

    <div class="team-card right">
      <div class="logo-box">
        <img src="file:///www/wwwroot/statsfut.com/static/teams/estados-unidos/1077312.png" alt="Jacksonville">
      </div>
      <div class="team-label">JACKSONVILLE</div>
    </div>
  </div>

  <!-- 4. Target Board -->
  <div class="target-board">
    <div class="target-info">
      <div class="target-tag">PROJEÇÃO PRINCIPAL</div>
      <div class="target-pick">OVER 1.5 GOLS</div>
    </div>
    <div class="target-rate">77%</div>
  </div>

  <!-- 5. CTA -->
  <div class="cta-watch">
    <div class="cta-watch-text">⚡ ASSISTA O RAIO-X COMPLETO</div>
  </div>

</div>

</body>
</html>
