<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatsFut · Preview do Vídeo Atemporal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
        body {
            background:#0b0f19; color:#f8fafc;
            min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:30px 16px;
        }
        .container {
            width:100%; max-width:960px;
            background:rgba(15,23,42,0.85); border:1px solid rgba(255,255,255,0.08);
            border-radius:20px; padding:32px; box-shadow:0 25px 50px rgba(0,0,0,0.6);
            backdrop-filter:blur(16px);
        }
        .header { text-align:center; margin-bottom:24px; }
        .badge {
            display:inline-block; background:rgba(16,185,129,0.12); color:#10b981;
            padding:4px 12px; border-radius:9999px; font-size:12px; font-weight:700;
            text-transform:uppercase; margin-bottom:12px; border:1px solid rgba(16,185,129,0.3);
        }
        h1 { font-size:24px; font-weight:800; margin-bottom:8px; }
        p { color:#94a3b8; font-size:14px; }
        .video-wrapper {
            position:relative; padding-bottom:56.25%; height:0; overflow:hidden;
            border-radius:14px; border:1px solid rgba(255,255,255,0.1); background:#020617;
            margin-top:20px;
        }
        .video-wrapper video {
            position:absolute; top:0; left:0; width:100%; height:100%;
        }
        .info {
            margin-top:20px; display:flex; justify-content:space-between; font-size:13px; color:#64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">Masterclass 4K Ultra HD · Micro-Animações Snappy</div>
            <h1>Drip Staking no Over 1.5 (Live Trading Avançado)</h1>
            <p>100% Sincronizado linha por linha · Resposta imediata · Efeitos Snappy</p>
        </div>
        <div class="video-wrapper">
            <video controls autoplay playsinline preload="auto">
                <source src="/api/dl-video/video_teste_atemporal_4k.mp4" type="video/mp4">
                Seu navegador não suporta a tag de vídeo.
            </video>
        </div>
        <div class="info">
            <span>Duração: ~3m 18s (Amostra Estendida)</span>
            <span>Resolução: 3840x2160 (4K UHD)</span>
            <span>Status: Privado / Em Teste</span>
        </div>
    </div>
</body>
</html>
